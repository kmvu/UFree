name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Release Note (Optional)"
        required: false
        default: "Manual Release"

# Keep in sync with .github/workflows/ci.yml and local Xcode.
env:
  XCODE_VERSION: "26.6"

jobs:
  deploy:
    name: Build & Ship
    # TestFlight deploys are main-only. Refuse other refs even if dispatch is misused.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      actions: read
      checks: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Require green main-push Quality Check (incl. emulator-integration)
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const workflowFile = 'ci.yml';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              head_sha: sha,
              per_page: 20,
            });

            // PR runs skip emulator-integration. Only a successful *push* to main
            // (which includes that job) may unlock TestFlight.
            const successfulPush = (data.workflow_runs || []).find(
              (run) =>
                run.status === 'completed' &&
                run.conclusion === 'success' &&
                run.event === 'push'
            );

            if (!successfulPush) {
              const summaries = (data.workflow_runs || [])
                .slice(0, 5)
                .map((r) => `${r.id}:${r.event}/${r.status}/${r.conclusion}`)
                .join(', ') || 'none';
              core.setFailed(
                `No successful main-push Quality Check (ci.yml) for SHA ${sha}. ` +
                  `PR-only green runs are not enough (emulator-integration is skipped on PRs). ` +
                  `Push to main, wait for firestore-rules + unit-tests + lint + emulator-integration (+ ui-tests), then re-run deploy. ` +
                  `Recent runs: ${summaries}`
              );
              return;
            }

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: successfulPush.id,
            });
            const integration = (jobsData.jobs || []).find((j) =>
              (j.name || '').includes('Emulator Integration')
            );
            if (!integration || integration.conclusion !== 'success') {
              core.setFailed(
                `Quality Check run ${successfulPush.id} did not include a successful Emulator Integration job ` +
                  `(got: ${integration ? integration.conclusion : 'missing'}). ` +
                  `Deploy only after a green push to main.`
              );
              return;
            }

            core.info(
              `Green main-push CI gate OK: run ${successfulPush.id} ` +
                `(emulator-integration=${integration.conclusion}) ${successfulPush.html_url}`
            );

      - name: Verify required secrets
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          require() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          }
          require "GOOGLE_SERVICE_INFO_PLIST" "$GOOGLE_SERVICE_INFO_PLIST"
          require "ASC_KEY_ID" "$ASC_KEY_ID"
          require "ASC_ISSUER_ID" "$ASC_ISSUER_ID"
          if [ -z "$ASC_KEY_CONTENT" ] && [ -z "$ASC_KEY" ]; then
            echo "::error::Missing required secret: ASC_KEY_CONTENT (or legacy ASC_KEY)"
            missing=1
          fi
          require "MATCH_PASSWORD" "$MATCH_PASSWORD"
          require "SSH_PRIVATE_KEY" "$SSH_PRIVATE_KEY"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required deploy secrets are present."

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Reads tracked .ruby-version (3.3.0)
          bundler-cache: true

      - name: Setup SSH & Trust Bitbucket
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Temporary Keychain
        run: |
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l ~/Library/Keychains/build.keychain

      - name: Restore GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ./GoogleService-Info.plist

      - name: Build and Upload
        # Tests always run inside fastlane beta (SKIP_TESTS removed).
        # Green CI on this SHA is still required above so we never ship an unvalidated commit.
        run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT || secrets.ASC_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          RELEASE_NOTE: ${{ github.event.inputs.reason }}
