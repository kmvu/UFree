name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with local Xcode (xcodebuild -version) and macos-26 runner image.
env:
  XCODE_VERSION: "26.6"

jobs:
  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase-tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run rules unit tests
        run: npm test

  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: ruby/setup-ruby@v1
        with:
          # Reads tracked .ruby-version (3.3.0)
          bundler-cache: true

      - name: Restore GoogleService-Info.plist
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" ]; then
            echo "::error::Missing GOOGLE_SERVICE_INFO_PLIST secret"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ./GoogleService-Info.plist

      - name: Run Tests
        run: bundle exec fastlane tests
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

      - name: Coverage summary
        if: always()
        run: |
          RESULT=$(find fastlane/test_results -name '*.xcresult' | head -1 || true)
          if [ -z "$RESULT" ]; then
            echo "No xcresult bundle found; skipping coverage summary."
            exit 0
          fi
          REPORT=$(xcrun xccov view --report --only-targets "$RESULT" || true)
          echo "$REPORT"
          {
            echo "## Unit test coverage"
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage / result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            fastlane/test_results/**
          if-no-files-found: warn
          retention-days: 14

  ui-tests:
    name: UI Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore GoogleService-Info.plist
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" ]; then
            echo "::error::Missing GOOGLE_SERVICE_INFO_PLIST secret"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ./GoogleService-Info.plist

      - name: Run UI Tests
        run: bundle exec fastlane ui_tests
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            fastlane/test_results/ui/**
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint
        run: |
          # macos runners sometimes ship an untrusted aws/tap that spams brew warnings.
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap || true
          fi
          # Runner images sometimes omit or unlink SwiftLint — install when missing.
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Run SwiftLint
        run: |
          # Fail on error-severity only (baseline). Do not use --strict yet —
          # that would require a full style rewrite.
          swiftlint lint --reporter github-actions-logging --quiet

  integration-gate:
    name: Integration gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq '^(firestore\.rules|firebase\.json|UFree/Core/Data/|UFreeIntegrationTests/)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  emulator-integration:
    name: Emulator Integration
    needs: integration-gate
    if: needs.integration-gate.outputs.should_run == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore GoogleService-Info.plist
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" ]; then
            echo "::error::Missing GOOGLE_SERVICE_INFO_PLIST secret"
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ./GoogleService-Info.plist

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Run integration tests against Auth + Firestore emulators
        env:
          UFREE_INTEGRATION_TESTS: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
        # singleProjectMode in firebase.json routes the plist project to emulators.
        run: |
          firebase emulators:exec \
            --only auth,firestore \
            --project ufree-313a2 \
            "bundle exec fastlane integration_tests"

      - name: Upload integration result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: fastlane/test_results/integration/**
          if-no-files-found: warn
          retention-days: 14
