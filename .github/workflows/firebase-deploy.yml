name: Deploy Firebase Rules & Hosting

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "public/**"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-firebase:
    name: Rules tests + Firebase deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Firebase CI token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Missing FIREBASE_TOKEN secret. Create one with \`firebase login:ci\` and add it under repo Settings → Secrets. See Docs/OPERATIONS_GUIDE.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install rules-test dependencies
        working-directory: firebase-tests
        run: npm ci

      - name: Run Firestore rules unit tests
        working-directory: firebase-tests
        run: npm test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy rules, indexes, and hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # Project id matches local .firebaserc (ufree-313a2). Spark only — no Functions.
        run: |
          firebase deploy \
            --project ufree-313a2 \
            --only firestore:rules,firestore:indexes,hosting \
            --non-interactive \
            --token "$FIREBASE_TOKEN"
